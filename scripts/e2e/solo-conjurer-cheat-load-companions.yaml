  - action: raw
    dt: 1
    ev: {type: key, key: 28, pressed: false}
  - action: raw
    dt: 4
    ev: {type: text_input, text: load con02a}
  - action: raw
    dt: 2
    ev: {type: key, key: 28, pressed: true}
  - action: raw
    dt: 1
    ev: {type: key, key: 28, pressed: false}
  - action: raw
    dt: 4
    ev: {type: key, key: 59, pressed: true}
