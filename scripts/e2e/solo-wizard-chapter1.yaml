steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept wizard class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept wizard color
  - action: wait
    dt: 1000
    name: wait for chapter one briefing
  - action: screen
    name: wizard chapter one before click
  - action: click
    x: 512
    y: 384
    name: dismiss wizard chapter one briefing
  - action: wait
    dt: 20
    name: observe wizard transition start
  - action: screen
    name: wizard chapter one click plus 20 ticks
  - action: wait
    dt: 100
    name: observe wizard transition completion
  - action: screen
    name: wizard chapter one click plus 120 ticks
  - action: wait
    dt: 500
    name: settle wizard gameplay
  - action: screen
    name: wizard gameplay after chapter one click
  - action: click-npc-dialog-done
    name: dismiss wizard opening dialog
  - action: wait
    dt: 60
    name: settle after wizard opening dialog
  - action: screen
    name: wizard opening dialog dismissed
  - action: run
    ang: 0.25
    dt: 120
    name: move wizard after chapter one
  - action: wait
    dt: 100
    name: settle wizard movement
  - action: screen
    name: wizard gameplay after movement
  - action: assert-spell-set-row
    row: 0
    name: verify initial spell set
  - action: spell-set-next
    name: advance the wizard spell set
  - action: assert-spell-set-row
    dt: 2
    row: 1
    name: verify next spell set
  - action: spell-set-prev
    name: return to the first spell set
  - action: assert-spell-set-row
    dt: 2
    row: 0
    name: verify previous spell set
  - action: spell-set-prev
    name: wrap to the last spell set
  - action: assert-spell-set-row
    dt: 2
    row: 4
    name: verify previous spell set wraps
  - action: spell-set-next
    name: wrap back to the first spell set
  - action: assert-spell-set-row
    dt: 2
    row: 0
    name: verify next spell set wraps
  - action: spell-set-select
    name: select spell set with the keyboard
  - action: assert-spell-set-row
    dt: 2
    row: 0
    name: verify keyboard spell set selection
  - action: spell-set-select
    name: advance spell set with a repeated selection key
  - action: assert-spell-set-row
    dt: 2
    row: 1
    name: verify repeated keyboard selection advances
  - action: spell-set-select
    name: select the third spell set
  - action: assert-spell-set-row
    dt: 2
    row: 2
    name: verify third spell set selection
  - action: spell-set-select
    name: select the fourth spell set
  - action: assert-spell-set-row
    dt: 2
    row: 3
    name: verify fourth spell set selection
  - action: spell-set-select
    name: select the last spell set
  - action: assert-spell-set-row
    dt: 2
    row: 4
    name: verify last spell set selection
  - action: spell-set-select
    name: repeat selection at the last spell set
  - action: assert-spell-set-row
    dt: 2
    row: 4
    name: verify keyboard selection stays on the last spell set
  - action: spell-set-prev
    name: select the fourth spell set before expanding
  - action: spell-set-prev
    dt: 2
    name: select the third spell set before expanding
  - action: assert-spell-set-row
    dt: 2
    row: 2
    name: verify the spell set to restore after closing
  - action: set-quickbar-spell
    spell: 50 # Magic Missile exercises the expanded icon draw path.
    slot: 0
    name: put a spell in the set before expanding
  - action: toggle-expanded-quickbar
    name: open the expanded spell bar
  - action: assert-quickbar-expanded
    dt: 2
    active: true
    name: verify the expanded spell bar opened
  - action: assert-spell-set-row
    row: 4
    name: verify the expanded bar uses its last row
  - action: toggle-expanded-quickbar
    name: close the expanded spell bar
  - action: assert-quickbar-expanded
    dt: 2
    active: false
    name: verify the expanded spell bar closed
  - action: assert-spell-set-row
    row: 2
    name: verify closing restores the selected spell set
  - action: assert-quickbar-spell
    spell: 50
    slot: 0
    name: verify closing preserves the selected set's spell
  - action: assert-native-exit-save-location
    name: verify a loaded map exit creates a save location at its destination
  - action: quit
    dt: 1
