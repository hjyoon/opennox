# Five player self-cast script levels and an NPC's normal animated cast onto
# the player. No hand, buff, duration, cursor packet or removal is supplied.
# Actual mouse-motion events must move the native hand to the client's actual
# MSG_MOUSE world coordinate. The stock CLASS NULL hand has no draw record;
# the client player's buff must still be published and naturally removed.
# The original strict >20*FPS hand expiry, next-tick delayed finalization and
# two on/two off audio events are observed with unchanged HP/mana.
# This is not incantation/mana spending or
# autonomous NPC selection. Screenshots are diagnostic, never new goldens.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-telekinesis-spell
    count: 1
    text: player-script
    name: Telekinesis level one script
  - action: check-telekinesis-spell
    count: 2
    text: player-script
    name: Telekinesis level two script
  - action: check-telekinesis-spell
    count: 3
    text: player-script
    name: Telekinesis level three script
  - action: check-telekinesis-spell
    count: 4
    text: player-script
    name: Telekinesis level four script
  - action: check-telekinesis-spell
    count: 5
    text: player-script
    name: Telekinesis level five script
  - action: check-telekinesis-spell
    count: 0
    text: npc-animated
    name: Telekinesis NPC native animated cast
  - action: quit
    dt: 1
