    active: true
    mode: 2
    count: 3
    name: verify server shop buy action
  - action: screen
    name: host game server shop buy mode
  - action: assert-inventory-count
    item: RedPotion
    count: 0
    name: verify inventory before purchase
  - action: set-player-gold
    gold: 100
    name: fund actual server purchase
