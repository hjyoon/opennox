steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: grant-item
    item: RedPotion
    count: 3
    name: grant a real three-potion server stack
  - action: wait
    dt: 30
    name: receive pickup reports
  - action: assert-inventory-count
    item: RedPotion
    count: 3
    name: verify three server inventory objects
  - action: inventory
    name: open inventory
  - action: wait
    dt: 90
    name: settle inventory animation
  - action: move
    x: 339
    y: 88
    name: point at potion stack
  - action: raw
    dt: 2
    ev:
      type: button
      pressed: true
  - action: raw
    dt: 4
    ev:
      type: move
      pos:
        x: 100
        y: 400
  - action: raw
    dt: 1
    ev:
      type: button
      pressed: false
  - action: wait
    dt: 20
    name: settle first amount dialog
  - action: assert-item-amount
    amount: 1
    max: 3
    name: verify initial amount and stack maximum
  - action: screen
    name: host game item amount one
  - action: click
    x: 159
    y: 394
    name: increment amount to two
  - action: wait
    dt: 5
  - action: assert-item-amount
    amount: 2
    max: 3
    name: verify incremented amount
  - action: screen
    name: host game item amount two
  - action: click
    x: 42
    y: 423
    name: cancel first amount dialog
  - action: wait
    dt: 20
    name: settle cancel
  - action: assert-item-amount-closed
    name: verify cancel closed dialog
  - action: assert-inventory-count
    item: RedPotion
    count: 3
    name: verify cancel preserved server stack
  - action: move
    x: 339
    y: 88
    name: point at potion stack again
  - action: raw
    dt: 2
    ev:
      type: button
      pressed: true
  - action: raw
    dt: 4
    ev:
      type: move
      pos:
        x: 100
        y: 400
  - action: raw
    dt: 1
    ev:
      type: button
      pressed: false
  - action: wait
    dt: 20
    name: settle second amount dialog
  - action: assert-item-amount
    amount: 1
    max: 3
    name: verify reopened amount dialog
  - action: click
    x: 159
    y: 394
    name: increment accepted amount to two
  - action: wait
    dt: 5
  - action: assert-item-amount
    amount: 2
    max: 3
    name: verify accepted amount
  - action: click
    x: 18
    y: 423
    name: accept two dropped potions
  - action: wait
    dt: 30
    name: process two drop packets
  - action: assert-item-amount-closed
    name: verify accept closed dialog
  - action: assert-inventory-count
    item: RedPotion
    count: 1
    name: verify two server inventory objects dropped
  - action: screen
    name: host game item amount accepted
  - action: quit
    dt: 1
