# Stock host startup, five named Mark levels, four real marker allocations
# and four targeted relocations. Placement and NPC WAIT are input setup only.
# Observe live slots/charges/owners/timestamps/HP/mana/audio and client objects.
# Cleanup uses registered MarkerDie; no forced slots, expiry or damage outputs.
# Captures are private diagnostics, not replacement goldens or audible proof.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-mark-slots-spell
    count: 1
    name: named Mark level one
  - action: check-mark-slots-spell
    count: 2
    name: named Mark level two
  - action: check-mark-slots-spell
    count: 3
    name: named Mark level three
  - action: check-mark-slots-spell
    count: 4
    name: named Mark level four
  - action: check-mark-slots-spell
    count: 5
    name: named Mark level five
  - action: quit
    dt: 1
