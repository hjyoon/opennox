# Actual Wizard host, script self casts at levels 1..5 for player and stock
# NPC, one naturally animated NPC cast, and two real NewTrap/world collisions.
# Observe natural enchant/expiry, WhiteSpark pixels and Glyph electric damage.
# No HP, buff, timer, damage, drawable, network packet or pixel result injection.
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-shock-spell
    count: 1
    text: player
    name: Player Shock level one
  - action: check-shock-spell
    count: 2
    text: player
    name: Player Shock level two
  - action: check-shock-spell
    count: 3
    text: player
    name: Player Shock level three
  - action: check-shock-spell
    count: 4
    text: player
    name: Player Shock level four
  - action: check-shock-spell
    count: 5
    text: player
    name: Player Shock level five
  - action: check-shock-spell
    count: 1
    text: npc
    name: NPC Shock level one
  - action: check-shock-spell
    count: 2
    text: npc
    name: NPC Shock level two
  - action: check-shock-spell
    count: 3
    text: npc
    name: NPC Shock level three
  - action: check-shock-spell
    count: 4
    text: npc
    name: NPC Shock level four
  - action: check-shock-spell
    count: 5
    text: npc
    name: NPC Shock level five
  - action: check-shock-spell
    text: npc-natural
    name: NPC natural Shock cast
  - action: check-shock-spell
    text: glyph-to-npc
    name: Player Shock Glyph to NPC
  - action: check-shock-spell
    text: glyph-to-player
    name: NPC Shock Glyph to player
  - action: quit
    dt: 1
