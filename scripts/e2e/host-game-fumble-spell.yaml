# Real Warrior host, normal script object casts and a stock NPC's naturally
# animated cast. Grants/equip, placement and waiting AI are setup, not results.
# Targeted projectiles retain stock mode-selected power, not requested levels.
# Verify weapon/shield drop, retained body/spare gear, ordinary-monster drop-all,
# HP invariance, drawables for drops in real host vision, client equipment replay.
# Random reachable drops behind corners stay server-side, not injected into view.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
