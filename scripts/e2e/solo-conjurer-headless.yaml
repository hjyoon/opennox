# Run with NOX_E2E_SEAT=headless to exercise all three early conjurer campaign
# setpieces and subsequent escape-menu input without opening an SDL window.
# Helpers position the player at map triggers; game scripts, timers, damage,
# summons, Charm completion, network updates and dialog clicks remain real.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
    name: wait for class selection
  - action: click
    x: 512
    y: 208
    name: select conjurer
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept conjurer class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept conjurer color
  - action: wait
    dt: 1000
    name: wait for chapter one briefing
  - action: click
    x: 512
    y: 384
    name: dismiss chapter one briefing
  - action: wait
    dt: 620
    name: play conjurer opening dialog
  - action: click-npc-dialog-done
    name: dismiss conjurer opening dialog
  - action: wait
    dt: 60
    name: settle after opening dialog
  - action: run-con01a-bear-setpiece
    name: verify Con01A bear damage and player release
  - action: switch-map
    map: Con02a
    name: switch to Con02A for necromancer event
  - action: wait-map
    map: Con02a
    name: wait for Con02A
  - action: click-chapter-briefing
    name: dismiss Con02A chapter briefing
  - action: wait-forced-coop-autosave
    name: wait for Con02A autosave
  - action: run-con02a-necromancer-setpiece
    name: verify Con02A necromancer summon and dialog input
  - action: run-con02a-charm-wolf-setpiece
    name: verify Con02A Charm lesson and friendly follow state
  - action: esc
    name: open escape menu
  - action: wait
    dt: 120
    name: settle escape menu
  - action: assert-escape-menu
    active: true
    name: verify escape menu opened after Charm
  - action: esc
    name: close escape menu
  - action: wait
    dt: 120
    name: settle after closing escape menu
  - action: assert-escape-menu
    active: false
    name: verify escape menu closed after Charm
  - action: quit
    dt: 1
