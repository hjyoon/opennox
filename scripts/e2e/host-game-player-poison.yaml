steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: arm-player-hud-bars
    name: send partial health and mana totals to the host client
  - action: assert-player-hud-bars
    name: verify the health and mana values and visible tube fills
  - action: arm-player-poison
    name: set poison on the host player
  - action: assert-player-hud-poisoned
    name: verify the green health fill and poison tube overlay
  - action: assert-player-poison-damage
    name: verify the natural poison tick and metadata
  - action: cure-player-poison
    item: antidote
    name: cure poison with a CurePoisonPotion
  - action: assert-player-hud-poison-cleared
    name: verify the antidote restores the red health tube
  - action: arm-player-poison
    dt: 3
    name: poison the host again for the spell cure
  - action: cure-player-poison
    item: spell
    name: cure poison with the Cure Poison spell
  - action: assert-player-hud-poison-cleared
    name: verify Cure Poison restores the red health tube
  - action: arm-player-poison
    dt: 3
    name: poison the host again for the mushroom cure
  - action: cure-player-poison
    item: mushroom
    name: cure poison with a mushroom and check confusion
  - action: assert-player-hud-poison-cleared
    name: verify the mushroom restores the red health tube
  - action: quit
    dt: 1
