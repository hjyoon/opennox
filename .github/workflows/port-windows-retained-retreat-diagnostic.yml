name: Verify corrected Windows386 explicit retreat faults

on:
  push:
    branches: [port/go1.27-multiarch]
    paths: [.github/workflows/port-windows-retained-retreat-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retained:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOARCH: '386'
      GOEXPERIMENT: ''
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 02f5372889d218cd1afd5f074dc177e877dea829
          path: retained-source
          persist-credentials: false

      - name: Restore and verify the unchanged failed primary artifact
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess,urllib.error,urllib.request,zipfile
          source='02f5372889d218cd1afd5f074dc177e877dea829';aid=14313856742
          repo=Path('retained-source').resolve();out=Path('diagnostic').resolve();out.mkdir()
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=repo,text=True).strip()==source
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(aid)
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(api,headers=headers),timeout=60)as response:meta=json.load(response)
          assert meta['id']==aid and not meta['expired']and meta['name']=='opennox-server-windows-386'and meta['workflow_run']['head_sha']==source
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,request,fp,code,msg,response_headers,newurl):return None
          try:
              urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(api+'/zip',headers=headers),timeout=60)
              raise AssertionError('Expected artifact redirect')
          except urllib.error.HTTPError as response:
              assert response.code==302;location=response.headers['Location']
          archive=out/'unchanged-primary.zip'
          with urllib.request.urlopen(location,timeout=120)as response,archive.open('xb')as stream:
              while chunk:=response.read(1024*1024):stream.write(chunk)
          sha=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert archive.stat().st_size==meta['size_in_bytes']==188777718
          assert 'sha256:'+sha==meta['digest']and sha=='15d3f846b4ee95cf52ac40c4a8ac02a8b0e1cad9e4fbd9176186de5fca849378'
          report=out/'primary';report.mkdir()
          with zipfile.ZipFile(archive)as z:
              assert z.read('source-revision.txt').decode('utf-8-sig').strip()==source
              for member in z.infolist():assert not Path(member.filename).is_absolute()and'..'not in Path(member.filename).parts
              z.extractall(report)
          manifest=json.loads((report/'test-binaries.json').read_text(encoding='utf-8-sig'))
          for row in manifest:
              f=report/'test-binaries'/row['name'];assert f.stat().st_size==row['bytes']and hashlib.sha256(f.read_bytes()).hexdigest()==row['sha256']
          assert next(r['sha256']for r in manifest if r['name']=='server.test.exe')=='617f8721e714ea9fa941bd8f05dce52729d0fd71516c5569d204e24892617b9a'
          (out/'provenance.json').write_text(json.dumps(dict(source_revision=source,workflow_revision=os.environ['WORKFLOW_REVISION'],original_artifact=meta,archive_sha256=sha,test_binaries=manifest,rebuilt=False,original_failure_preserved=True),indent=2)+'\n')

      - name: Observe original exceptions without changing the PE or thread state
        shell: python
        run: |
          # Microsoft Win32 DEBUG_EVENT / WOW64_CONTEXT / debugger exception handling.
          # https://learn.microsoft.com/windows/win32/debug/debugger-exception-handling
          from pathlib import Path
          import ctypes as C,ctypes.wintypes as W,hashlib,json,os,re,struct,subprocess,time
          repo=Path('retained-source').resolve();out=Path('diagnostic').resolve();binary=out/'primary/test-binaries/server.test.exe'
          digest=lambda f:hashlib.sha256(f.read_bytes()).hexdigest()
          before=digest(binary);assert before=='617f8721e714ea9fa941bd8f05dce52729d0fd71516c5569d204e24892617b9a'
          assert C.sizeof(C.c_void_p)==8
          class ExceptionRecord(C.Structure):
              _fields_=[('code',W.DWORD),('flags',W.DWORD),('record',C.c_void_p),('address',C.c_void_p),('count',W.DWORD),('information',C.c_size_t*15)]
          class ExceptionInfo(C.Structure):
              _fields_=[('record',ExceptionRecord),('first_chance',W.DWORD)]
          class DebugData(C.Union):
              _fields_=[('exception',ExceptionInfo),('words',C.c_size_t*20),('bytes',C.c_ubyte*160)]
          class DebugEvent(C.Structure):
              _fields_=[('kind',W.DWORD),('pid',W.DWORD),('tid',W.DWORD),('data',DebugData)]
          assert C.sizeof(ExceptionRecord)==152 and C.sizeof(ExceptionInfo)==160 and C.sizeof(DebugEvent)==176 and DebugEvent.data.offset==16
          k=C.WinDLL('kernel32',use_last_error=True)
          k.WaitForDebugEvent.argtypes=[C.POINTER(DebugEvent),W.DWORD];k.WaitForDebugEvent.restype=W.BOOL
          k.ContinueDebugEvent.argtypes=[W.DWORD,W.DWORD,W.DWORD];k.ContinueDebugEvent.restype=W.BOOL
          k.ReadProcessMemory.argtypes=[W.HANDLE,C.c_void_p,C.c_void_p,C.c_size_t,C.POINTER(C.c_size_t)];k.ReadProcessMemory.restype=W.BOOL
          k.OpenThread.argtypes=[W.DWORD,W.BOOL,W.DWORD];k.OpenThread.restype=W.HANDLE
          k.CloseHandle.argtypes=[W.HANDLE];k.CloseHandle.restype=W.BOOL
          k.Wow64GetThreadContext.argtypes=[W.HANDLE,C.c_void_p];k.Wow64GetThreadContext.restype=W.BOOL
          def memory(handle,address,size):
              buffer=C.create_string_buffer(size);got=C.c_size_t()
              ok=k.ReadProcessMemory(handle,C.c_void_p(address),buffer,size,C.byref(got))
              return dict(address=hex(address),ok=bool(ok),bytes=buffer.raw[:got.value].hex(),error=C.get_last_error()if not ok else 0)
          def context(tid):
              handle=k.OpenThread(0x48,False,tid)
              if not handle:return dict(error=C.get_last_error())
              try:
                  buffer=C.create_string_buffer(716);struct.pack_into('<I',buffer,0,0x10007)
                  if not k.Wow64GetThreadContext(handle,buffer):return dict(error=C.get_last_error())
                  names=['edi','esi','ebx','edx','ecx','eax','ebp','eip','cs','eflags','esp','ss']
                  return {n:hex(v)for n,v in zip(names,struct.unpack_from('<12I',buffer.raw,156))}
              finally:k.CloseHandle(handle)
          results=[]
          selectors=[('whole-family',r'^TestMonsterRetreatOriginalNative545440$')]
          for label,selector in selectors:
              for debug in [True]:
                  folder=out/(label+('-debug'if debug else'-ordinary'));folder.mkdir()
                  command=[str(binary),'-test.v','-test.count=1','-test.timeout=3m','-test.run='+selector]
                  intent=dict(command=command,cwd=str(repo/'src/server'),exact_PE_sha256=before,rebuilt=False,debugger=debug,thread_or_process_memory_modified=False)
                  (folder/'intent.json').write_text(json.dumps(intent,indent=2)+'\n')
                  events=[];start=time.monotonic();timed=False;image_base=None;loader_breaks=set()
                  pe=binary.read_bytes();image_size=struct.unpack_from('<I',pe,struct.unpack_from('<I',pe,0x3c)[0]+24+56)[0]
                  with(folder/'stdout.log').open('xb')as stdout,(folder/'stderr.log').open('xb')as stderr:
                      child=subprocess.Popen(command,cwd=repo/'src/server',stdout=stdout,stderr=stderr,creationflags=2 if debug else 0,env=dict(os.environ,GOEXPERIMENT=''))
                      if not debug:
                          try:code=child.wait(timeout=210)
                          except subprocess.TimeoutExpired:timed=True;child.kill();code=child.wait()
                      else:
                          while True:
                              if time.monotonic()-start>210:timed=True;child.kill()
                              event=DebugEvent()
                              if not k.WaitForDebugEvent(C.byref(event),1000):
                                  if C.get_last_error()==121:continue
                                  raise C.WinError(C.get_last_error())
                              status=0x00010002;row=dict(kind=event.kind,pid=event.pid,tid=event.tid)
                              if event.kind==3:
                                  image_base=int(event.data.words[3]);row['image_base']=hex(image_base)
                                  if event.data.words[0]:k.CloseHandle(event.data.words[0])
                              elif event.kind==6:
                                  row['DLL_base']=hex(int(event.data.words[1]))
                                  if event.data.words[0]:k.CloseHandle(event.data.words[0])
                              elif event.kind==1:
                                  e=event.data.exception;r=e.record;pc=int(r.address or 0)
                                  row.update(code=hex(r.code),first_chance=int(e.first_chance),address=hex(pc),image_RVA=hex(pc-image_base)if image_base is not None else None,information=[hex(r.information[i])for i in range(min(r.count,15))],registers=context(event.tid),instruction_bytes=memory(int(child._handle),max(0,pc-16),64))
                                  if r.code in [0x80000003,0x4000001f]and r.code not in loader_breaks and image_base is not None and not image_base<=pc<image_base+image_size:
                                      loader_breaks.add(r.code);row['initial_loader_breakpoint']=True
                                  else:status=0x80010001
                                  if 'esp'in row['registers']:row['stack_bytes']=memory(int(child._handle),int(row['registers']['esp'],16),256)
                              elif event.kind==5:row['exit_code']=int(struct.unpack_from('<I',event.data.bytes)[0])
                              row['continuation']=hex(status);events.append(row)
                              with(folder/'debug-events.jsonl').open('a')as stream:stream.write(json.dumps(row)+'\n')
                              assert k.ContinueDebugEvent(event.pid,event.tid,status),C.get_last_error()
                              if event.kind==5:code=child.wait(timeout=30);break
                  after=digest(binary);assert after==before
                  result=dict(intent,exit_code=code,timed_out=timed,elapsed_seconds=time.monotonic()-start,PE_hash_after=after,exception_events=[r for r in events if r['kind']==1],diagnostic_only=True,full_suite_pass_claim=False)
                  fixture=repo/'src/server/testdata/monster_retreat_native_original_545440.json'
                  assert digest(fixture)=='0b7f612e30ea1f7093bd798152097f2c4a2dc52a24d141551ee29e04ab402352'
                  original=json.loads(fixture.read_text())['rows'];assert len(original)==1465 and sum(r['result']['fault']for r in original)==4
                  root='TestMonsterRetreatOriginalNative545440';expected={root}|{root+'/'+r['input']['name']for r in original}
                  pattern=re.compile(r'^\s*--- (PASS|FAIL|SKIP): (\S+) \(');terminal=[]
                  for line in (folder/'stdout.log').read_text(errors='replace').splitlines():
                      if match:=pattern.match(line):terminal.append(match.groups())
                  assert code==0 and not timed and len(terminal)==1466 and {n for action,n in terminal}==expected and all(action=='PASS'for action,n in terminal)
                  access=[r for r in result['exception_events']if r['code']=='0xc0000005']
                  assert not access,access
                  result.update(all1465_original_contexts_and4_fault_expectations_preserved=True,all1466_terminal_identities_exact=True,access_violation_events=0,scope='Exact corrected primaryPE only; original expected faults occur as Go panics, with zero Windows access violations in this family. No whole-engine GC repair claim.')
                  (folder/'summary.json').write_text(json.dumps(result,indent=2)+'\n');results.append(result)
                  print(json.dumps(dict(label=folder.name,exit_code=code,timed_out=timed,exceptions=len(result['exception_events']))),flush=True)
          (out/'retreat-diagnostic-summary.json').write_text(json.dumps(results,indent=2)+'\n')

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows386-corrected-retreat-fault-observation
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
