# Stock Quest menu and four real exit transitions generate the stage 5 minions.
# Place only the player beside the existing monster. AI, spells, HP, inventory,
# damage, death and reward-drop paths are not injected.
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
  - action: click
    x: 184
    y: 200
    name: host Quest
  - action: wait
    dt: 400
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
  - action: click
    x: 352
    y: 608
    name: accept color
  - action: wait
    dt: 400
  - action: click
    x: 512
    y: 487
    name: dismiss Quest guide
  - action: wait
    dt: 530
  - action: assert-quest-stage
    count: 1
    map: g_templd
    name: initial Quest stage playable
  - action: enter-quest-exit
    name: combat sequence stage 1 exit
  - action: wait
    dt: 400
  - action: click-chapter-briefing
    name: dismiss combat sequence stage 2 briefing
