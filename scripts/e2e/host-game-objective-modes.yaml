steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: set-objective-game-mode
    game-mode: ctf
    name: select CTF mode preference
  - action: switch-map
    map: capflag
    name: load stock Capture the Flag map
  - action: wait-map
    map: capflag
    name: wait for CTF server and client map load
  - action: assert-objective-game-mode
    dt: 120
    game-mode: ctf
    name: verify native CTF objectives
  - action: set-objective-game-mode
    game-mode: flagball
    name: select FlagBall mode preference
  - action: switch-map
    map: flagball
    name: load stock FlagBall map
  - action: wait-map
    map: flagball
    name: wait for FlagBall server and client map load
  - action: assert-objective-game-mode
    dt: 120
    game-mode: flagball
    name: verify live native FlagBall and minimap
  - action: reset-flagball
    name: reset native FlagBall during live server ticks
  - action: assert-objective-game-mode
    dt: 4
    game-mode: flagball
    name: verify old ball deletion and replacement minimap mark
  - action: create-objective-teams
    name: create the two goal teams through the normal game routine
  - action: join-objective-team
    name: join a real FlagBall team through the normal network request
  - action: approach-flagball
    name: collide with the stock ball through ordinary server physics
  - action: assert-flagball-carried
    dt: 4
    name: verify native carrier owner and team after pickup
  - action: approach-flagball-goal
    dt: 8
    name: bring the carried ball to the opposing stock goal
  - action: assert-flagball-scored
    dt: 4
    name: verify exactly one point and normal ball respawn
  - action: reset-objective-teams
    name: return to a free-for-all roster before loading KOTR
  - action: set-objective-game-mode
    game-mode: kotr
    name: select KOTR mode preference
  - action: switch-map
    map: bludeath
    name: load stock King of the Realm compatible map
  - action: wait-map
    map: bludeath
    name: wait for KOTR server and client map load
  - action: assert-objective-game-mode
    dt: 120
    game-mode: kotr
    name: verify live native crown and minimap
  - action: approach-stock-crown
    name: collide with the existing stock crown through ordinary server physics
  - action: assert-ground-item-picked
    dt: 8
    name: verify crown server and client inventories
  - action: assert-crown-state
    owned-by-player: true
    name: verify crown ownership enchant and minimap removal
  - action: inventory
    name: open inventory for crown drop
  - action: wait
    dt: 120
    name: settle inventory animation
  - action: drag-inventory-item-out
    item: Crown
    name: attempt the stock KOTR crown drop through the real mouse path
  - action: assert-ground-item-picked
    dt: 8
    name: verify KOTR rejected the inventory drop and retained the crown
  - action: assert-crown-state
    owned-by-player: true
    name: verify rejected drop preserved ownership enchant and minimap state
  - action: inventory
    name: close inventory before entering observer mode
  - action: wait
    dt: 90
    name: settle inventory close animation
  - action: esc
    name: open the escape menu
  - action: assert-escape-menu
    dt: 60
    active: true
    name: verify the escape menu opened
  - action: click-observer-mode
    name: return the crown by clicking the ordinary observer mode button
  - action: assert-ground-item-dropped
    dt: 8
    name: verify observer transition dropped the crown and replicated it to the client
  - action: assert-crown-state
    name: verify crown owner cleared enchant removed and minimap restored
  - action: quit
    dt: 1
