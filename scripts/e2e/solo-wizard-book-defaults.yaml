# Natural Solo book rewards, original 0x600 defaults, real manual toggles,
# repeated awards, and preservation of every other quickbar entry.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept wizard class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept wizard color
  - action: wait
    dt: 1000
    name: wait for chapter one briefing
  - action: screen
    name: wizard chapter one before click
  - action: click
    x: 512
    y: 384
    name: dismiss wizard chapter one briefing
  - action: wait
    dt: 20
    name: observe wizard transition start
  - action: screen
    name: wizard chapter one click plus 20 ticks
  - action: wait
    dt: 100
    name: observe wizard transition completion
  - action: screen
    name: wizard chapter one click plus 120 ticks
  - action: wait
    dt: 500
    name: settle wizard gameplay
  - action: screen
    name: wizard gameplay after chapter one click
  - action: click-npc-dialog-done
    name: dismiss wizard opening dialog
  - action: wait
    dt: 60
    name: settle after wizard opening dialog
  - action: check-book-reward-default
    spell: 36
    active: true
    name: wizard Haste book default
  - action: check-book-reward-default
    spell: 62
    active: true
    name: wizard Protection from Fire book default
  - action: check-book-reward-default
    spell: 51
    active: false
    name: wizard Shield book default
  - action: check-book-reward-default
    spell: 71
    active: false
    name: wizard Shock book default
  - action: check-book-reward-default
    spell: 27
    active: false
    name: wizard Fireball book default
  - action: screen
    name: wizard natural book defaults and manual preferences
  - action: quit
    dt: 1
