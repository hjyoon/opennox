# Six directed Player/Monster/NPC pairs for each spell family.
# Ordinary script casts: player keyboard/mana and autonomous AI are separate.
# Stock ownership supplies hostility; damage/buffs/packets are not injected.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select unshielded wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-spell-unit-matrix
    text: fireball
    name: flame projectile damage
  - action: check-spell-unit-matrix
    text: magic-missile
    name: explosion direct and splash
  - action: check-spell-unit-matrix
    text: poison
    name: targeted poison and natural DOT
  - action: check-spell-unit-matrix
    text: death-ray
    name: weaponless raw damage and real ray FX
  - action: check-spell-unit-matrix
    text: confused
    name: confusion animation and expiry
  - action: check-spell-unit-matrix
    text: stun
    name: mass-aware stun and expiry
  - action: check-spell-unit-matrix
    text: slow
    name: slow particles and expiry
  - action: check-spell-unit-matrix
    text: freeze
    name: freeze and expiry
  - action: check-spell-unit-matrix
    text: blind
    name: blindness and expiry
  - action: quit
    dt: 1
