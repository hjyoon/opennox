name: Porting Windows GC diagnostic

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact source revision to reproduce without changing tests
        type: string
        required: true
      profiles:
        description: Diagnostic instrumentation; native production gate is unchanged
        type: choice
        options: [checks, report, checkptr, gccheckmark, race]
        default: checks

permissions:
  contents: read

jobs:
  diagnostic:
    name: Windows/amd64 ${{ matrix.profile }} diagnostic
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profiles == 'checks' && '["checkptr","gccheckmark","race"]' || format('["{0}"]', inputs.profiles)) }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GOOS: windows
      GOARCH: amd64
      DIAGNOSTIC_PROFILE: ${{ matrix.profile }}
      GOEXPERIMENT: ${{ matrix.profile == 'checkptr' && 'cgocheck2' || '' }}
      GODEBUG: ${{ matrix.profile == 'gccheckmark' && 'gccheckmark=1' || '' }}
      CGO_ENABLED: '1'
      CGO_CFLAGS_ALLOW: '-f.*'
      CGO_CFLAGS: '-O2 -g -fno-peephole2'
      SOURCE_REVISION: ${{ inputs.source_revision }}
      REPORT_DIR: ${{ github.workspace }}/build/windows-gc-diagnostic
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Preserve and repair only the zombie-object report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mingwBin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64/bin'
          "CC=$(Join-Path $mingwBin 'gcc.exe')" >> $env:GITHUB_ENV
          "CXX=$(Join-Path $mingwBin 'g++.exe')" >> $env:GITHUB_ENV
          $mingwBin >> $env:GITHUB_PATH
          New-Item -ItemType Directory -Force $env:REPORT_DIR | Out-Null
          $revision = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $revision -ne $env:SOURCE_REVISION) { throw 'Source mismatch' }
          if (& git status --porcelain) { throw 'Source checkout must be clean' }
          $goroot = (& go env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Missing Go toolchain' }
          $path = Join-Path $goroot 'src/runtime/mgcsweep.go'
          $text = [System.IO.File]::ReadAllText($path)
          Copy-Item $path (Join-Path $env:REPORT_DIR 'mgcsweep-before.go.txt')
          $start = $text.IndexOf('func (s *mspan) reportZombies() {')
          if ($start -lt 0) { throw 'Unknown zombie report' }
          $prefix = $text.Substring(0, $start)
          $tail = $text.Substring($start)
          $needle = "`tmbits := s.markBitsForBase()"
          if ([regex]::Matches($tail, [regex]::Escape($needle)).Count -ne 1) { throw 'Unexpected report implementation' }
          # The sweeper has already drained inline marks into gcmarkBits.
          # Read those same bits for diagnostics. Marking/sweeping are unchanged.
          $patched = $prefix + $tail.Replace($needle, "`tmbits := markBits{&s.gcmarkBits.x, 1, 0}")
          [System.IO.File]::WriteAllText($path, $patched, [System.Text.UTF8Encoding]::new($false))
          Copy-Item $path (Join-Path $env:REPORT_DIR 'mgcsweep-after.go.txt')
          $diagnosticRecord = @{
            source_revision = $revision
            diagnostic_only = $true
            instrumentation_profile = $env:DIAGNOSTIC_PROFILE
            GODEBUG = $env:GODEBUG
            collector_unchanged = $true
            native_compiler_environment = 'MSYS2 UCRT64 GCC'
            report_fix = 'https://github.com/golang/go/issues/80799'
            GOEXPERIMENT = (& go env GOEXPERIMENT).Trim()
            go_version = (& go version).Trim()
            before_sha256 = (Get-FileHash (Join-Path $env:REPORT_DIR 'mgcsweep-before.go.txt') -Algorithm SHA256).Hash.ToLower()
            after_sha256 = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          }
          $expectedExperiment = if ($env:DIAGNOSTIC_PROFILE -eq 'checkptr') { 'cgocheck2' } else { '' }
          if ($diagnosticRecord.GOEXPERIMENT -ne $expectedExperiment) { throw 'Unexpected diagnostic experiment' }
          $diagnosticRecord | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:REPORT_DIR 'diagnostic-profile.json')
          $diagnosticRecord | ConvertTo-Json
      - name: Reproduce unchanged full native suites with exact JSON streams
        working-directory: src
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOTOOLCHAIN = 'local'
          $p = [System.Diagnostics.Process]::new()
          $p.StartInfo.FileName = (Get-Command go).Source
          $p.StartInfo.UseShellExecute = $false
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.RedirectStandardError = $true
          # -work alone still omits Go test debug information. A named output
          # directory keeps the exact executed binaries with their symbols.
          $testOutput = Join-Path $env:RUNNER_TEMP 'opennox-diagnostic-test-binaries'
          New-Item -ItemType Directory -Force $testOutput | Out-Null
          $testArguments = @('test','-work',"-o=$testOutput",'-tags=server','-json','-count=1','-timeout=20m')
          if ($env:DIAGNOSTIC_PROFILE -eq 'checkptr') { $testArguments += '-gcflags=all=-d=checkptr=2' }
          if ($env:DIAGNOSTIC_PROFILE -eq 'race') { $testArguments += '-race' }
          $testArguments += @('.','./server','./legacy')
          foreach ($arg in $testArguments) {
            $p.StartInfo.ArgumentList.Add($arg)
          }
          $out = [System.IO.File]::Open((Join-Path $env:REPORT_DIR 'test.jsonl'), [System.IO.FileMode]::CreateNew)
          $err = [System.IO.File]::Open((Join-Path $env:REPORT_DIR 'test.stderr.log'), [System.IO.FileMode]::CreateNew)
          try {
            if (-not $p.Start()) { throw 'Test process failed to start' }
            $copyOut = $p.StandardOutput.BaseStream.CopyToAsync($out)
            $copyErr = $p.StandardError.BaseStream.CopyToAsync($err)
            $p.WaitForExit()
            [System.Threading.Tasks.Task]::WaitAll(@($copyOut, $copyErr))
            $code = $p.ExitCode
          } finally {
            $out.Dispose()
            $err.Dispose()
            $p.Dispose()
          }
          $code | Set-Content (Join-Path $env:REPORT_DIR 'test.exit')
          # Preserve the actual failed/passing native test executables for
          # symbol, relocation and GC-root inspection after the runner exits.
          # Use the workflow revision's collector, since checkout above is
          # deliberately the exact historical source under diagnosis.
          $collector = Join-Path $env:REPORT_DIR 'preserve-go-test-binaries.py'
          & git show '${{ github.sha }}:scripts/preserve-go-test-binaries.py' | Set-Content -Encoding utf8 $collector
          if ($LASTEXITCODE -ne 0) { throw 'Missing diagnostic binary collector' }
          & python $collector $env:REPORT_DIR $testOutput
          if ($LASTEXITCODE -ne 0) { throw 'Exact test executable preservation failed' }
          Get-FileHash (Join-Path $env:REPORT_DIR 'test.jsonl') -Algorithm SHA256
          exit $code
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-gc-diagnostic-${{ inputs.source_revision }}-${{ matrix.profile }}-${{ github.run_attempt }}
          path: build/windows-gc-diagnostic/
          if-no-files-found: error
          retention-days: 7
