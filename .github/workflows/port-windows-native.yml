name: Porting Windows native gate

on:
  workflow_dispatch:
  push:
    branches:
      - port/go1.26-multiarch
    paths:
      - .github/workflows/port-windows-native.yml
      - scripts/**
      - src/**
      - toolchain/go-version.txt

permissions:
  contents: read

jobs:
  server:
    name: Windows/${{ matrix.arch }} server
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: '386'
            msystem: MINGW32
            mingw_dir: mingw32
            gcc_package: mingw-w64-i686-gcc
          - arch: amd64
            msystem: MINGW64
            mingw_dir: mingw64
            gcc_package: mingw-w64-x86_64-gcc
    env:
      GOOS: windows
      CGO_ENABLED: '1'
      CGO_CFLAGS_ALLOW: '-f.*'
      CGO_CFLAGS: '-O2 -g -fno-peephole2'
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.gcc_package }}

      - name: Verify toolchain
        shell: pwsh
        run: |
          $mingwBin = Join-Path (Join-Path '${{ steps.msys2.outputs.msys2-location }}' '${{ matrix.mingw_dir }}') 'bin'
          $env:CC = Join-Path $mingwBin 'gcc.exe'
          $env:CXX = Join-Path $mingwBin 'g++.exe'
          if (-not (Test-Path $env:CC)) { throw "Missing compiler: $env:CC" }
          # cgo starts GCC frontends in child processes; they need MinGW DLLs on PATH.
          $env:PATH = "$mingwBin;$env:PATH"
          $mingwBin >> $env:GITHUB_PATH
          "CC=$env:CC" >> $env:GITHUB_ENV
          "CXX=$env:CXX" >> $env:GITHUB_ENV
          & .\scripts\go.ps1 version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CC --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'int opennox_cgo_probe;' | & $env:CC -x c -fsyntax-only -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe Windows/386 cgo toolchain
        if: matrix.arch == '386'
        working-directory: src
        shell: pwsh
        env:
          GOARCH: '386'
        run: |
          & ..\scripts\go.ps1 test -x runtime/cgo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build server product
        working-directory: src
        shell: pwsh
        run: |
          & ..\scripts\go.ps1 run ./internal/noxbuild "-o=../build/windows-$env:TARGET_ARCH" -os=windows "-arch=$env:TARGET_ARCH" "-cc=$env:CC" "-cxx=$env:CXX" opennox-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify product and run help
        working-directory: src
        shell: pwsh
        run: |
          $product = [System.IO.Path]::GetFullPath("../build/windows-$env:TARGET_ARCH/opennox-server.exe")
          & ..\scripts\go.ps1 run ./internal/noxbuild -verify $product
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $product -h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test root, server, and legacy packages
        working-directory: src
        shell: pwsh
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          & ..\scripts\go.ps1 test -tags server -count=1 -timeout=20m . ./server ./legacy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opennox-server-windows-${{ matrix.arch }}
          path: build/windows-${{ matrix.arch }}/opennox-server.exe
          if-no-files-found: warn
          retention-days: 1
