# Enter the War01A StartWizardSetpiece polygon through the real client/server
# transition path and verify that Jerry, Bryan, and the Wizard all act before
# the script returns control to the player.
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept warrior class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept warrior color
  - action: wait
    dt: 1000
    name: wait for chapter one briefing
  - action: click
    x: 512
    y: 384
    name: dismiss chapter one briefing
  - action: wait
    dt: 620
    name: wait for opening dialog
  - action: click-npc-dialog-done
    name: dismiss warrior opening dialog
  - action: wait
    dt: 60
    name: settle after warrior opening dialog
  - action: run-war01a-wizard-setpiece
    name: simulate Dun Mir three NPC event
  - action: screen
    name: war01a three NPC event completed
  - action: quit
    dt: 1
