# Real inventory mouse equip/dequip and stock material/pixel observation.
# Uses the stock Sword/FireProtect1 fixture, not custom sprite/color assets.
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: grant-engage-item
    item: Sword
    modifier: FireProtect1
    mask: 1
    name: grant unique sword with native fire protection modifier
  - action: wait
    dt: 30
    name: receive engage item inventory report
  - action: inventory
    name: open inventory
  - action: wait
    dt: 90
    name: settle inventory animation
  - action: click-inventory-item
    item: Sword
    name: equip sword through mouse and MSG_TRY_EQUIP
  - action: assert-engage-item-equipped
    name: verify native item engage callback and equipment state
  - action: inventory
    name: close inventory for character palette check
  - action: wait
    dt: 90
    name: settle after closing inventory
  - action: assert-equipment-colors
    mode: 0
    name: compare live player stock equipment materials and pixels
  - action: inventory
    name: reopen inventory for dequip
  - action: wait
    dt: 90
    name: settle after reopening inventory
  - action: click-inventory-item
    item: Sword
    name: dequip sword through mouse and MSG_TRY_DEQUIP
  - action: assert-engage-item-dequipped
    name: verify native item disengage callback and equipment state
  - action: quit
    dt: 1
