# A fresh Warrior campaign loads stock War03b, awards purchase funds only,
# and buys the original Wolf1/Wolf2 through Henrick's dialog and real Yes/Done
# input. No wolf is spawned, reowned, healed or given migration/AI flags.
# Only player placement at each stock exit is a fixture; normal collision,
# cooperative save/load, networking and follower updates do the transitions.
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
  - action: click
    x: 512
    y: 656
    name: accept warrior class
  - action: wait
    dt: 700
  - action: click
    x: 352
    y: 608
    name: accept warrior color
  - action: wait
    dt: 1000
  - action: click
    x: 512
    y: 384
    name: dismiss chapter one briefing
  - action: wait
    dt: 620
  - action: click-npc-dialog-done
    name: dismiss warrior opening dialog
  - action: wait
    dt: 60
  - action: run-war01a-wizard-setpiece
    name: finish stock Dun Mir three NPC event before leaving chapter one
  - action: wait
    dt: 60
  - action: switch-map
    map: War03b
    name: load stock War03b purchase map
  - action: wait-map
    map: War03b
    name: wait for War03b
  - action: wait
    dt: 120
    name: finish the stock map-entry fade before resuming autosave
  - action: prepare-war03b-wolf-purchase
    name: capture original Wolf1 and Wolf2 and award purchase funds
  - action: screen
    name: War03b stock town arrival dialog
  - action: click-npc-dialog-done
    name: close stock town arrival dialog
  - action: wait-forced-coop-autosave
    name: wait for War03b autosave
  - action: open-henrick-dialog
    name: ask Henrick to buy first wolf
  - action: screen
    name: War03b stock first wolf purchase dialog
  - action: click-npc-dialog-yes
    name: accept first 200 gold purchase
  - action: assert-war03b-wolf-purchase
    count: 1
    name: first original wolf is now a monitored pet
  - action: click-npc-dialog-done
    name: close first purchase receipt
  - action: wait
    dt: 30
  - action: open-henrick-dialog
    name: ask Henrick to buy second wolf
  - action: click-npc-dialog-yes
    name: accept second 200 gold purchase
  - action: assert-war03b-wolf-purchase
    count: 2
    name: both original wolves are monitored pets after paying 400 gold
  - action: click-npc-dialog-done
    name: close second purchase receipt
  - action: wait
    dt: 60
  - action: contact-purchased-wolf-exit
    map: War03c
    name: enter stock War03c exit with purchased wolves
  - action: wait-forced-coop-autosave
    name: wait for War03c autosave
  - action: wait
    dt: 30
  - action: assert-purchased-wolf-transition
    name: both purchased wolves visible inside War03c
  - action: wait
    dt: 240
  - action: assert-purchased-wolf-transition
    name: both purchased wolves remain after War03c gameplay
  - action: screen
    name: War03b purchased wolves inside War03c
  - action: contact-purchased-wolf-exit
    map: War03b
    name: return through stock exit to saved War03b
  - action: wait-forced-coop-autosave
    name: wait for saved War03b autosave
  - action: wait
    dt: 30
  - action: assert-purchased-wolf-transition
    name: same purchased wolves restored in saved War03b without duplicates
  - action: wait
    dt: 240
  - action: assert-purchased-wolf-transition
    name: same purchased wolves remain after saved War03b gameplay
  - action: screen
    name: War03b purchased wolves after saved map return
  - action: quit
    dt: 1
