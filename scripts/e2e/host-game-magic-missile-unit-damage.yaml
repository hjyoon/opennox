# Actual Magic Missile creation/search/homing/collision in both directions,
# all five levels and the natural NPC animation/cast-frame path.
# Durable HP, placement, cursor and waiting AI are setup. The observer never
# supplies HP damage, missile Target, collision, metadata, packets or results.
# Script requests do not simulate player mana/incantation input.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-magic-missile-unit-damage
    count: 1
    text: player-to-npc
    name: Magic Missile player-to-npc level 1
  - action: check-magic-missile-unit-damage
    count: 2
    text: player-to-npc
    name: Magic Missile player-to-npc level 2
  - action: check-magic-missile-unit-damage
    count: 3
    text: player-to-npc
    name: Magic Missile player-to-npc level 3
  - action: check-magic-missile-unit-damage
    count: 4
    text: player-to-npc
    name: Magic Missile player-to-npc level 4
  - action: check-magic-missile-unit-damage
    count: 5
    text: player-to-npc
    name: Magic Missile player-to-npc level 5
  - action: check-magic-missile-unit-damage
    count: 1
    text: npc-to-player
    name: Magic Missile npc-to-player level 1
  - action: check-magic-missile-unit-damage
    count: 2
    text: npc-to-player
    name: Magic Missile npc-to-player level 2
