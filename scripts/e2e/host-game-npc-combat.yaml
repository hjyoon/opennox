# Real stock AI selection, attack timing, native damage, network frames and
# client rendering. Only ordinary placement/ownership/properties/equipment
# and durable setup HP are supplied; no attack result or AI stack is injected.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-npc-attack-animation
    item: LongSword
    name: NPC longsword complete attack cycles
  - action: check-npc-attack-animation
    item: StaffWooden
    name: NPC staff complete attack cycles
  - action: check-npc-attack-animation
    item: WarHammer
    name: NPC hammer complete attack cycles
  - action: check-npc-incoming-attack
    item: GruntAxe
    name: NPC receives GruntAxe blade attacks
  - action: check-npc-incoming-attack
    item: StoneGolem
    name: NPC receives StoneGolem crush attacks
  - action: check-npc-incoming-attack
    item: Scorpion
    name: NPC receives Scorpion impale attacks
  - action: check-npc-incoming-attack
    item: Ghost
    name: NPC receives Ghost drain attacks
  - action: check-npc-incoming-attack
    item: Spider
    name: NPC receives Spider bite attacks
  - action: check-npc-incoming-attack
    item: VileZombie
    name: NPC receives VileZombie claw attacks
  - action: quit
    dt: 1
