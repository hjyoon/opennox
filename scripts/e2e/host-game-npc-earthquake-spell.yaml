# Stock Wizard startup and five ordinary player Earthquake script levels
# against the stock NPC PlayerDamage callback. Position, durable HP and WAIT
# are setup, never supplied damage, attribution, client packets or captures.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-npc-earthquake-spell
    count: 1
    name: Earthquake NPC target level one script
  - action: check-npc-earthquake-spell
    count: 2
    name: Earthquake NPC target level two script
  - action: check-npc-earthquake-spell
    count: 3
    name: Earthquake NPC target level three script
  - action: check-npc-earthquake-spell
    count: 4
    name: Earthquake NPC target level four script
  - action: check-npc-earthquake-spell
    count: 5
    name: Earthquake NPC target level five script
  - action: quit
    dt: 1
