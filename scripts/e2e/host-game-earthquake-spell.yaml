# Stock Wizard startup, natural NPC CAST_ON_OBJECT followed by five player
# script levels. Placement, durability and WAIT are setup only. No damage,
# animation frame, quake packet, HUD value or screenshot outcome is supplied.
# This deliberately requires real damage as well as a non-crashing cast.
# A still-unsupported downstream damage shape must fail, never be skipped.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-earthquake-spell
    count: 0
    text: npc-animated
    name: Earthquake NPC native animated cast
  - action: check-earthquake-spell
    count: 1
    text: player-script
    name: Earthquake level one script
  - action: check-earthquake-spell
    count: 2
    text: player-script
    name: Earthquake level two script
  - action: check-earthquake-spell
    count: 3
    text: player-script
    name: Earthquake level three script
  - action: check-earthquake-spell
    count: 4
    text: player-script
    name: Earthquake level four script
  - action: check-earthquake-spell
    count: 5
    text: player-script
    name: Earthquake level five script
  - action: quit
    dt: 1
