# Ordinary script injury and passive map properties on stock Troll/NPC bodies.
# Food starts 160 units away. Production AI must enter RETREAT and execute its
# own MOVE_TO/PICKUP callback. Observe stock healing/sound/deletion and client
# drawables without injecting an action, pickup, healing or expected result.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-ai-retreat-food
    text: Troll/ascending/RedApple
    name: RETREAT food Troll ascending apple
  - action: check-ai-retreat-food
    text: Troll/descending/RedApple
    name: RETREAT food Troll descending apple
  - action: check-ai-retreat-food
    text: Troll/ascending/Meat
    name: RETREAT food Troll ascending meat
  - action: check-ai-retreat-food
    text: Troll/descending/Meat
    name: RETREAT food Troll descending meat
  - action: check-ai-retreat-food
    text: NPC/ascending/RedApple
    name: RETREAT food NPC ascending apple
  - action: check-ai-retreat-food
    text: NPC/descending/RedApple
    name: RETREAT food NPC descending apple
  - action: check-ai-retreat-food
    text: NPC/ascending/Meat
    name: RETREAT food NPC ascending meat
  - action: check-ai-retreat-food
    text: NPC/descending/Meat
    name: RETREAT food NPC descending meat
  - action: quit
    dt: 1
