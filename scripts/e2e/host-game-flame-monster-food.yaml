    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: arm-player-flame-damage
    name: create stock Flame on host player
  - action: wait
    dt: 2
    name: process live Flame collision
  - action: assert-player-flame-damage
    name: verify Flame reduces player health
  - action: arm-monster-food-consumption
    creature: Spider
    item: RedApple
    name: injure high-aggression spider and place apple in AI search range
  - action: wait
    dt: 18
    name: run monster AI through apple cadence
  - action: assert-monster-food-consumed
    name: verify apple heals monster and disappears
  - action: wait
    dt: 2
    name: finalize delayed apple deletion
  - action: arm-monster-food-consumption
    creature: Spider
    item: Meat
    name: injure same high-aggression spider and place meat in AI search range
  - action: wait
    dt: 18
    name: run monster AI through meat cadence
  - action: assert-monster-food-consumed
    name: verify meat heals monster and disappears
  - action: wait
    dt: 2
    name: finalize delayed meat deletion
  - action: arm-monster-food-consumption
    creature: Spider
    item: Mushroom
    name: poison high-aggression spider and place mushroom in AI search range
  - action: wait
    dt: 18
    name: run monster AI through mushroom cadence
  - action: assert-monster-food-consumed
    name: verify mushroom cures poison and disappears
  - action: quit
    dt: 1
