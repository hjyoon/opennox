# Stock defensive spell flags, cooldowns, RNG and AI actions are untouched.
# The player supplies ordinary level-1 Magic Missile attacks via the script API;
# the monster must choose inversion, animate its self-cast, retarget a real
# missile, return it to the player and deal an attributed ordinary collision hit.
# Tracked missiles must then disappear through normal server/client removal.
# Mana/incantation input is outside this AI/ownership regression.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-ai-inversion
    text: Wizard/ascending
    name: stock Wizard rising diagonal
  - action: check-ai-inversion
    text: Wizard/descending
    name: stock Wizard falling diagonal
  - action: check-ai-inversion
    text: WizardGreen/ascending
    name: stock green Wizard rising diagonal
  - action: check-ai-inversion
    text: WizardGreen/descending
    name: stock green Wizard falling diagonal
  - action: check-ai-inversion
    text: UrchinShaman/ascending
    name: stock Urchin Shaman rising diagonal
  - action: check-ai-inversion
    text: UrchinShaman/descending
    name: stock Urchin Shaman falling diagonal
  - action: quit
    dt: 1
