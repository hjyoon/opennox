# Spawn three real player-owned creatures and exercise the loaded campaign
# ExitCollide/save/load pipeline. No migration or ownership flags are injected.
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
    name: wait for class selection
  - action: click
    x: 512
    y: 208
    name: select conjurer
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept conjurer class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept conjurer color
  - action: wait
    dt: 1000
    name: wait for chapter one briefing
  - action: click
    x: 512
    y: 384
    name: dismiss chapter one briefing
  - action: wait
    dt: 620
    name: wait for opening dialog
  - action: click-npc-dialog-done
    name: dismiss opening dialog
  - action: wait
    dt: 60
    name: settle after opening dialog
  - action: create-transition-summons
    name: summon two wolves and an urchin
  - action: enter-pet-transition-exit
    map: con02a
    name: enter stock campaign exit
  - action: click-chapter-briefing
    name: dismiss destination chapter briefing
  - action: wait-forced-coop-autosave
    name: wait for destination autosave
  - action: wait
    dt: 30
    name: settle destination network updates
  - action: assert-transition-summons
    name: preserve all summons beside player
  - action: enter-pet-transition-exit
    name: enter next stock campaign exit
  - action: click-chapter-briefing
    name: dismiss next chapter briefing
  - action: wait-forced-coop-autosave
    name: wait for next autosave
  - action: wait
    dt: 30
    name: settle next network updates
  - action: assert-transition-summons
    name: preserve all summons after second map transition
  - action: enter-pet-transition-exit
    map: con02a
    name: return to saved chapter two map through stock exit
  - action: wait-forced-coop-autosave
    name: wait for third autosave
  - action: wait
    dt: 30
    name: settle third network updates
  - action: assert-transition-summons
    name: preserve all summons after third map transition
  - action: quit
    dt: 1
