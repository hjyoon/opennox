seed-save: true
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign with autosave
  - action: wait
    dt: 500
    name: wait for autosave selection
  - action: assert-coop-autosave-selected
    name: verify isolated autosave selection
  - action: click
    x: 512
    y: 608
    name: load selected autosave
  - action: wait-map
    map: War01a
    name: wait for autosave map
  - action: wait-player-reloaded
    name: verify autosave player binding
  - action: run
    ang: 0.25
    dt: 180
    name: move warrior after autosave load
  - action: wait
    dt: 100
    name: settle autosave movement
  - action: assert-player-moved-after-reload
    name: verify autosave player control
  - action: quit
    dt: 1
