# Stock War01a equipment replay and per-layer material/pixel observation.
# The existing visible-NPC fixture positions and freezes one equipped NPC;
# this checks rendering, not natural movement or combat. No PNG assets needed.
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept warrior class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept warrior color
  - action: wait
    dt: 1000
    name: wait for chapter one briefing
  - action: click
    x: 512
    y: 384
    name: dismiss chapter one briefing
  - action: wait
    dt: 620
    name: wait for opening dialog
  - action: click-npc-dialog-done
    name: dismiss warrior opening dialog
  - action: wait
    dt: 60
    name: settle after warrior opening dialog
  - action: assert-npc-equipment-visible
    name: observe native stock NPC equipment replay and layers
  - action: wait
    dt: 15
    name: render stock NPC and player
  - action: assert-equipment-colors
    mode: 1
    name: compare live NPC stock equipment materials and pixels
  - action: quit
    dt: 1
