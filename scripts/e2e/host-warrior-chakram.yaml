# Functional player throw regression: real Warrior menus, stock item grant,
# actual inventory equip and mouse/button attack. A failed launch is reported
# as a failure. Natural target damage, return and re-equipping the original
# weapon are observed without injecting attack or collision results.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: grant-item
    item: RoundChakram
    count: 1
    name: grant stock chakram
  - action: wait
    dt: 30
    name: receive inventory packet
  - action: inventory
    name: open inventory
  - action: wait
    dt: 90
    name: settle inventory animation
  - action: click-inventory-item
    item: RoundChakram
    name: equip chakram through actual inventory input
  - action: wait
    dt: 30
    name: settle equipment report
  - action: inventory
    name: close inventory
  - action: wait
    dt: 60
    name: settle after inventory
  - action: check-player-thrown-weapon
    item: RoundChakram
    name: chakram player use
  - action: quit
    dt: 1
