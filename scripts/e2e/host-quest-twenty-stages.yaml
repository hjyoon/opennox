# Real Quest menu -> twenty consecutive stock stages. Only placement at a loaded
# exit is a fixture; map/stage flags, minions, rewards, HP, packets and UI state
# are never injected. count in assert-quest-stage is the expected stage; in
# assert-quest-minion it is the minimum number of live, native monsters.
# assert-quest-generators reads native caps against the stock balance; it does
# not initialize, strengthen or repair a generator.
# Stock selector sequence with the original monster WAIT draws.
