# Stock Imp AI must choose its own enemy and deal damage before any incoming hit.
# Only placement/facing/durable player HP and the hostile NPC's ordinary
# aggression/equipment properties are setup. No SeenEnemies, CurrentEnemy,
# PreferredEnemy, FIGHT, Injured, damage callback, packet or pixels are injected.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-ai-first-attack
    text: Imp/ascending/clear
    name: Imp ascending clear
  - action: check-ai-first-attack
    text: Imp/ascending/off-ray-box
    name: Imp ascending off-ray-box
  - action: check-ai-first-attack
    text: Imp/descending/clear
    name: Imp descending clear
  - action: check-ai-first-attack
    text: Imp/descending/off-ray-box
    name: Imp descending off-ray-box
  - action: quit
    dt: 1

