# Exercise the Wiz01A Horvath/Urchin NoxScript timers and verify that
# Horvath's lightning actually kills the Urchins after they meet.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept wizard class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept wizard color
  - action: wait
    dt: 1000
    name: wait for chapter one briefing
  - action: click
    x: 512
    y: 384
    name: dismiss wizard chapter one briefing
  - action: wait
    dt: 620
    name: settle wizard gameplay
  - action: click-npc-dialog-done
    name: dismiss wizard opening dialog
  - action: wait
    dt: 60
    name: settle after wizard opening dialog
  - action: run
    ang: 0.25
    dt: 120
    name: move wizard after chapter one
  - action: wait
    dt: 100
    name: settle wizard movement
  - action: call-noxscript-function
    function: UrchinSetup
    name: start Wiz01A Horvath and Urchin scene
  - action: wait
    dt: 300
    name: exercise Urchin return and Horvath approach timers
  - action: capture-wizard1-urchins
    name: capture Urchins before lightning encounter
  - action: move-wizard1-player-near-horvath
    name: bring scripted Urchin followers into Horvath encounter
  - action: wait
    dt: 1300
    name: exercise Horvath arrival and lightning fight
  - action: assert-wizard1-lightning-kills
    name: verify Horvath lightning kills Urchins
  - action: quit
    dt: 1
