# Real Quest menu -> six consecutive stock stages. Only placement at a loaded
# exit is a fixture; map/stage flags, minions, rewards, HP, packets and UI state
# are never injected. count in assert-quest-stage is the expected stage; in
# assert-quest-minion it is the minimum number of live, native monsters.
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
