seed-scenario: seed-solo-warrior-manual-save.yaml
steps:
  - action: slow
    dur: 1ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
  - action: interact
    x: 448
    y: 168
    name: open solo campaign in fresh process
  - action: wait
    dt: 500
  - action: select-manual-campaign-save
    slot: 1
    name: select SAVE0001 with real mouse
  - action: click
    x: 512
    y: 608
    name: load manual save in fresh process
  - action: wait-map
    map: War01a
    name: wait for saved map
  - action: assert-manual-save-restored
    name: verify fresh process player stats inventory and position
  - action: wait
    dt: 100
    name: wait for original fresh load fade
  - action: screen
    name: campaign manual save restored in fresh process
  - action: wait-player-reloaded
    name: bind fresh process loaded player
  - action: run
    ang: 0.75
    dt: 70
    name: real movement after fresh process load
  - action: assert-player-moved-after-reload
    name: verify fresh process loaded player control
  - action: quit
    dt: 1
