# Exercise the Wiz01A Horvath/Urchin NoxScript timers and verify that
# Horvath's lightning actually kills the Urchins after they meet.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: interact
    x: 448
    y: 168
    name: open solo campaign
  - action: wait
    dt: 500
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept wizard class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept wizard color
  - action: wait
    dt: 1000
    name: wait for chapter one briefing
  - action: click
    x: 512
    y: 384
    name: dismiss wizard chapter one briefing
  - action: wait
    dt: 620
    name: settle wizard gameplay
  - action: click-npc-dialog-done
    name: dismiss wizard opening dialog
  - action: wait
    dt: 60
    name: settle after wizard opening dialog
  - action: run
    ang: 0.25
    dt: 120
    name: move wizard after chapter one
  - action: wait
    dt: 100
    name: settle wizard movement
  - action: cast
    slot: 3
    name: invoke the wizard's third spell slot
  - action: wait
    dt: 2
    name: process third spell slot input
  - action: assert-last-spell-slot
    slot: 3
    name: verify the third spell slot reached client control
  - action: capture-wizard1-urchins
    name: capture map-placed Urchins before the setup trigger
  - action: enter-wizard1-urchin-setup-trigger
    name: enter the map's UrchinSetup collision trigger
  - action: wait
    dt: 300
    name: allow UrchinSetup's spawn timers to run
  - action: assert-wizard1-urchins-spawned
    name: verify the map collision trigger spawned Urchins
  - action: move-wizard1-player-near-horvath
    name: bring scripted Urchin followers into Horvath encounter
  - action: wait-wizard1-multiple-lightning-hits
    name: verify Horvath's lightning directly damages multiple Urchins
  - action: wait
    dt: 1300
    name: exercise Horvath arrival and lightning fight
  - action: assert-wizard1-lightning-kills
    name: verify Horvath lightning kills Urchins
  - action: quit
    dt: 1
