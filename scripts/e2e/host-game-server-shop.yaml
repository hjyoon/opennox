  - action: assert-shop
    active: true
    mode: 2
    count: 2
    name: verify client shop item removal
  - action: assert-inventory-count
    item: RedPotion
    count: 1
    name: verify purchased server inventory object
  - action: assert-player-gold
    gold: 60
    name: verify purchase gold subtraction
  - action: screen
    name: host game server shop purchased
  - action: click
    x: 786
    y: 695
    name: select server shop sell mode
  - action: wait
    dt: 10
    name: settle server shop sell mode
  - action: assert-shop
    active: true
    mode: 3
    count: 2
    name: verify server shop sell action
  - action: click
    x: 786
    y: 723
    name: select server shop repair mode
  - action: wait
    dt: 10
    name: settle server shop repair mode
  - action: assert-shop
    active: true
    mode: 4
    count: 2
    name: verify server shop repair action
  - action: click
    x: 786
    y: 752
    name: send actual server shop exit
  - action: wait
    dt: 60
    name: process server exit and close acknowledgement
  - action: assert-server-shop
    active: false
    name: verify native server session release
  - action: assert-shop
    active: false
    mode: 0
    count: 0
    name: verify server close acknowledgement
  - action: quit
    dt: 1
