# Real Wizard host startup and regular script casts at every Fist level in both
# directions, using an original NPC and the actual host PlayerDamage callbacks.
# Only placement, durable HP and ordinary waiting NPC AI are fixtures. Damage,
# ownership, physics, packets, client display and deletion are not injected.
# This is not autonomous NPC casting, incantation/mana or a death/trigger test.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-fist-unit-damage
    count: 1
    text: player-to-npc
    name: Player SmallFist against NPC
  - action: check-fist-unit-damage
    count: 2
    text: player-to-npc
    name: Player MediumFist against NPC
  - action: check-fist-unit-damage
    count: 3
    text: player-to-npc
    name: Player LargeFist level three against NPC
  - action: check-fist-unit-damage
    count: 4
    text: player-to-npc
    name: Player LargeFist level four against NPC
  - action: check-fist-unit-damage
    count: 5
    text: player-to-npc
    name: Player LargeFist level five against NPC
  - action: check-fist-unit-damage
    count: 1
    text: npc-to-player
    name: NPC SmallFist against Player
  - action: check-fist-unit-damage
    count: 2
    text: npc-to-player
    name: NPC MediumFist against Player
  - action: check-fist-unit-damage
    count: 3
    text: npc-to-player
    name: NPC LargeFist level three against Player
  - action: check-fist-unit-damage
    count: 4
    text: npc-to-player
    name: NPC LargeFist level four against Player
  - action: check-fist-unit-damage
    count: 5
    text: npc-to-player
    name: NPC LargeFist level five against Player
  - action: quit
    dt: 1
