# Both real stock G_Crypts diagonal secret walls; queued movement, not wall-state injection.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept warrior class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept warrior color
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: switch-map
    map: G_Crypts
    name: load stock map with touch-enabled secret walls
  - action: wait-map
    map: G_Crypts
    name: wait for normal map load and player binding
  - action: wait
    dt: 60
    name: settle after map entry
  # Placement only selects an existing stock secret wall's clear approach.
  # Actual queued movement drives collision/opening and both crossings.
  - action: check-secret-wall-touch
    name: stock secret wall contact and round-trip
  # The first wall remains open. Selecting a closed stock wall again therefore
  # exercises the other diagonal without resetting or writing either wall.
  - action: check-secret-wall-touch
    name: remaining stock diagonal contact and round-trip
  - action: quit
    dt: 20
