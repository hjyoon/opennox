    text: npc-to-player
    name: Magic Missile npc-to-player level 4
  - action: check-magic-missile-unit-damage
    count: 5
    text: npc-to-player
    name: Magic Missile npc-to-player level 5
  - action: check-magic-missile-unit-damage
    count: 0
    text: npc-to-player
    name: NPC natural Magic Missile animation against Player
  - action: quit
