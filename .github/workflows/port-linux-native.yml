name: Porting Linux native checkpoint

on:
  workflow_dispatch:
    inputs:
      products:
        description: Native products to qualify
        type: choice
        options:
          - server
          - all
        default: server
  push:
    branches:
      - port/go1.26-multiarch
    # Full qualification is deliberate: campaign edits reuse existing products.
    paths:
      - .github/workflows/port-linux-native.yml
      - toolchain/linux-native-ci-checkpoint.txt

permissions:
  contents: read

jobs:
  native:
    name: Linux/amd64 ${{ matrix.product }}
    if: github.ref == 'refs/heads/port/go1.26-multiarch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.products == 'server') && '["opennox-server"]' || '["opennox","opennox-hd","opennox-server","opennox-server-hd"]') }}
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '1'
      CC: gcc
      CXX: g++
      CGO_CFLAGS_ALLOW: '-f.*'
      CGO_CFLAGS: '-O2 -g -fno-peephole2'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      NOX_E2E_SEAT: headless
      NOX_E2E_AUDIO: mock
      NOX_XWIS: 'false'
      NOX_NET_NAT: 'false'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      ALSOFT_DRIVERS: 'null'
      NATIVE_PRODUCT: ${{ matrix.product }}
      NATIVE_REPORT_DIR: ${{ github.workspace }}/build/linux-amd64-${{ matrix.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Install native client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ pkg-config libsdl2-dev libopenal-dev

      - name: Verify native toolchain
        working-directory: src
        run: |
          test "$(uname -m)" = x86_64
          test "$(../scripts/go.sh env GOHOSTOS)" = linux
          test "$(../scripts/go.sh env GOHOSTARCH)" = amd64
          mkdir -p "$NATIVE_REPORT_DIR"
          ../scripts/go.sh version | tee "$NATIVE_REPORT_DIR/go-version.txt"
          gcc --version | tee "$NATIVE_REPORT_DIR/cc-version.txt"
          pkg-config --modversion sdl2 openal
          git rev-parse HEAD | tee "$NATIVE_REPORT_DIR/source-revision.txt"

      - name: Build and verify native product
        id: native_build
        working-directory: src
        run: |
          ../scripts/go.sh run ./internal/noxbuild -o="$NATIVE_REPORT_DIR" -os=linux -arch=amd64 -cc=gcc -cxx=g++ "$NATIVE_PRODUCT"
          product="$NATIVE_REPORT_DIR/$NATIVE_PRODUCT"
          ../scripts/go.sh run ./internal/noxbuild -verify "$product" > "$NATIVE_REPORT_DIR/product-verification.txt"
          ../scripts/go.sh version -m "$product" > "$NATIVE_REPORT_DIR/product-build-info.txt"
          sha256sum "$product" > "$NATIVE_REPORT_DIR/product.sha256"
          "$product" -h > "$NATIVE_REPORT_DIR/product-help.txt" 2>&1

      - name: Test every package for the product variant
        working-directory: src
        run: |
          set -euo pipefail
          ulimit -c 0
          # Compiler/linker allocation is separate from native fixture runtime.
          unset MALLOC_MMAP_THRESHOLD_
          tags=()
          case "$NATIVE_PRODUCT" in
            opennox) ;;
            opennox-hd) tags=(-tags=highres) ;;
            opennox-server) tags=(-tags=server) ;;
            opennox-server-hd) tags=(-tags=server,highres) ;;
            *) exit 2 ;;
          esac
          ../scripts/go.sh list "${tags[@]}" ./... > "$NATIVE_REPORT_DIR/expected-packages.txt"
          set +e
          # PIE also places the real C static regions above 4GiB. All original
          # high-address assertions and the fixed low-address cases still run.
          ../scripts/go.sh test "${tags[@]}" -buildmode=pie '-exec=/usr/bin/env MALLOC_MMAP_THRESHOLD_=0' -json -count=1 -timeout=20m ./... > "$NATIVE_REPORT_DIR/test.jsonl" 2> "$NATIVE_REPORT_DIR/test.stderr.log"
          status=$?
          set -e
          echo "$status" > "$NATIVE_REPORT_DIR/test.exit"
          printf '%s\n' '{"test_buildmode":"pie","test_runtime_MALLOC_MMAP_THRESHOLD_":"0","compiler_allocator":"default","product_buildmode":"default","product_allocator":"default"}' > "$NATIVE_REPORT_DIR/test-profile.json"
          python3 - "$NATIVE_REPORT_DIR" <<'PY'
          import collections, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          tests, packages = collections.Counter(), collections.Counter()
          terminal, failures = set(), []
          with (root / 'test.jsonl').open() as stream:
              for line in stream:
                  row = json.loads(line)
                  action = row.get('Action')
                  if action not in ('pass', 'fail', 'skip'):
                      continue
                  if row.get('Test'):
                      tests[action] += 1
                  else:
                      packages[action] += 1
                      terminal.add(row['Package'])
                  if action == 'fail':
                      failures.append(row)
          expected = set((root / 'expected-packages.txt').read_text().splitlines())
          summary = dict(test_exit_code=int((root / 'test.exit').read_text()),
                         test_actions=dict(tests), package_actions=dict(packages),
                         expected_packages=sorted(expected), terminal_packages=sorted(terminal),
                         missing_packages=sorted(expected - terminal), failures=failures)
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps({k: v for k, v in summary.items() if k != 'failures'}, indent=2))
          print('Recorded failures:', len(failures))
          if not expected or expected != terminal:
              sys.exit('Incomplete package evidence; inspect preserved test output')
          PY
          exit "$status"

      - name: Check damage through the default product link mode
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && matrix.product == 'opennox-server' }}
        working-directory: src
        run: |
          set -euo pipefail
          ulimit -c 0
          unset MALLOC_MMAP_THRESHOLD_
          set +e
          ../scripts/go.sh test -tags=server '-exec=/usr/bin/env MALLOC_MMAP_THRESHOLD_=0' -json -count=1 -timeout=20m -run '^Test(PlayerDamage|DefaultDamage|SelfMissileFlame|SourceLessElectricPrecisionOriginal)' . ./server ./legacy > "$NATIVE_REPORT_DIR/default-link-damage.jsonl" 2> "$NATIVE_REPORT_DIR/default-link-damage.stderr.log"
          status=$?
          set -e
          echo "$status" > "$NATIVE_REPORT_DIR/default-link-damage.exit"
          python3 - "$NATIVE_REPORT_DIR" <<'PY'
          import collections, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          tests, packages = collections.Counter(), {}
          with (root / 'default-link-damage.jsonl').open() as stream:
              for line in stream:
                  row = json.loads(line)
                  if row.get('Action') in ('pass', 'fail', 'skip'):
                      if row.get('Test'):
                          tests[row['Action']] += 1
                      else:
                          packages[row['Package']] = row['Action']
          summary = dict(test_buildmode='default', MALLOC_MMAP_THRESHOLD_='0',
                         test_actions=dict(tests), package_actions=packages,
                         exit_code=int((root / 'default-link-damage.exit').read_text()))
          (root / 'default-link-damage-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          expected = {'github.com/opennox/opennox/v1' + suffix for suffix in ('', '/server', '/legacy')}
          if set(packages) != expected:
              sys.exit('Incomplete default-link damage package evidence')
          PY
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-amd64-${{ matrix.product }}-${{ github.sha }}
          path: build/linux-amd64-${{ matrix.product }}/
          if-no-files-found: warn
          retention-days: 7
