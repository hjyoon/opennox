# Actual Wizard menu startup and object-to-position NoxScript casts at all five
# levels. A durable stock non-unit barrel isolates native creation, ownership,
# duplicate refusal, falling/collision/CRUSH damage, packets, drawing and normal
# deletion from incomplete unit-target damage/death admissions. No spell result
# or physics state is injected. This is not a particular map trigger, keyboard
# incantation, mana-cost, enemy-unit or Linux/AMD64 runtime test.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-fist-spell
    count: 1
    name: SmallFist script cast
  - action: check-fist-spell
    count: 2
    name: MediumFist script cast
  - action: check-fist-spell
    count: 3
    name: LargeFist level three script cast
  - action: check-fist-spell
    count: 4
    name: LargeFist level four script cast
  - action: check-fist-spell
    count: 5
    name: LargeFist level five script cast
  - action: quit
    dt: 1
