# Nonimmune stock AI must attack first, flee after an ordinary FEAR request,
# then resume combat after natural enchant expiry and ordinary player movement
# back into sight. No attack input, FLEE/action/path/timer or damage is injected.
# Stock non-Coop IMMUNE_FEAR NPCs must reject the spell and keep fighting.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-ai-fear
    text: Spider/ascending
    name: stock Spider rising diagonal fear
  - action: check-ai-fear
    text: Spider/descending
    name: stock Spider falling diagonal fear
  - action: check-ai-fear
    text: Troll/ascending
    name: stock Troll rising diagonal fear
  - action: check-ai-fear
    text: Troll/descending
    name: stock Troll falling diagonal fear
  - action: check-ai-fear
    text: Urchin/ascending
    name: stock Urchin rising diagonal fear
  - action: check-ai-fear
    text: Urchin/descending
    name: stock Urchin falling diagonal fear
  - action: check-ai-fear
    text: NPC/ascending
    name: hostile NPC rising diagonal fear
  - action: check-ai-fear
    text: NPC/descending
    name: hostile NPC falling diagonal fear
  - action: quit
    dt: 1
