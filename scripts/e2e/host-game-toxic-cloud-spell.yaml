# Stock Wizard startup and the normal position-to-position script API, five
# player script levels and one NPC CAST_ON_OBJECT animated by the game tick.
# Placement, target durability and WAIT are setup. No cloud, duration, damage,
# poison, cast-frame, packet or pixel outcome is supplied. The position API
# uses the real ImaginaryCaster; this is not a full VM/timer callback test.
# Player incantation/mana and autonomous NPC spell selection are not simulated.
# Diagnostic screenshots are private PNGs, never replacement goldens.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 768
    y: 208
    name: select wizard
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-toxic-cloud-spell
    count: 0
    text: script-pos-pos
    name: Toxic Cloud position-to-position script
  - action: check-toxic-cloud-spell
    count: 1
    text: player-script
    name: Toxic Cloud level one script
  - action: check-toxic-cloud-spell
    count: 2
    text: player-script
    name: Toxic Cloud level two script
  - action: check-toxic-cloud-spell
    count: 3
    text: player-script
    name: Toxic Cloud level three script
  - action: check-toxic-cloud-spell
    count: 4
    text: player-script
    name: Toxic Cloud level four script
  - action: check-toxic-cloud-spell
    count: 5
    text: player-script
    name: Toxic Cloud level five script
  - action: check-toxic-cloud-spell
    count: 0
    text: npc-animated
    name: Toxic Cloud NPC native animated cast
  - action: quit
    dt: 1
