# Real Warrior host, five normal script object casts and a stock NPC's queued
# animated cast. Placement/waiting AI are setup; no Poison or HP is injected.
# Requested levels do not override the stock mode-selected projectile power.
# Assert natural application, exact first DOT, client damage/HUD and cure replay.
steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: check-poison-spell
    count: 1
    text: player-to-npc
    name: Player Poison requested level one
  - action: check-poison-spell
    count: 2
    text: player-to-npc
    name: Player Poison requested level two
  - action: check-poison-spell
    count: 3
    text: player-to-npc
    name: Player Poison requested level three
  - action: check-poison-spell
    count: 4
    text: player-to-npc
    name: Player Poison requested level four
  - action: check-poison-spell
    count: 5
    text: player-to-npc
    name: Player Poison requested level five
  - action: check-poison-spell
    text: npc-to-player
    name: NPC natural Poison cast
  - action: quit
    dt: 1
