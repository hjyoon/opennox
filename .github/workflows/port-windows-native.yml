name: Porting Windows native gate

on:
  workflow_dispatch:
  push:
    branches:
      - port/go1.26-multiarch
    paths:
      - .gitattributes
      - .github/workflows/port-windows-native.yml
      - scripts/**
      # Campaign replay uses a prebuilt GUI product and local game assets.
      # These inputs do not change the Windows server build or native tests.
      - '!scripts/e2e/campaign/**'
      - '!scripts/run-campaign-e2e.py'
      - '!scripts/tests/test_campaign*.py'
      - src/**
      - toolchain/go-version.txt

permissions:
  contents: read

jobs:
  server:
    name: Windows/${{ matrix.arch }} server
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: '386'
            cflags: '-O2 -g'
          - arch: amd64
            cflags: '-O2 -g'
    env:
      GOOS: windows
      CGO_ENABLED: '1'
      CGO_CFLAGS_ALLOW: '-f.*'
      CGO_CFLAGS: ${{ matrix.cflags }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Install maintained UCRT compilers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # One pinned native Windows toolchain targets both architectures.
          # Its compiler setup does not start or upgrade an MSYS2 subsystem.
          $name = 'llvm-mingw-20261020-ucrt-x86_64'
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/$name.zip" -OutFile $archive
          $expected = 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd'
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "LLVM-MinGW archive digest mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          "LLVM_MINGW_BIN=$(Join-Path (Join-Path $env:RUNNER_TEMP $name) 'bin')" >> $env:GITHUB_ENV

      - name: Verify toolchain
        shell: pwsh
        run: |
          if ($env:TARGET_ARCH -eq '386') {
            $compilerTarget = 'i686'
          } else {
            $compilerTarget = 'x86_64'
          }
          $mingwBin = $env:LLVM_MINGW_BIN
          $env:CC = Join-Path $mingwBin "$compilerTarget-w64-mingw32-clang.exe"
          $env:CXX = Join-Path $mingwBin "$compilerTarget-w64-mingw32-clang++.exe"
          if (-not (Test-Path $env:CC)) { throw "Missing compiler: $env:CC" }
          # cgo compiler/linker child processes need the toolchain DLLs on PATH.
          $env:PATH = "$mingwBin;$env:PATH"
          $mingwBin >> $env:GITHUB_PATH
          "CC=$env:CC" >> $env:GITHUB_ENV
          "CXX=$env:CXX" >> $env:GITHUB_ENV
          & .\scripts\go.ps1 version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CC --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'int opennox_cgo_probe;' | & $env:CC -x c -fsyntax-only -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = "build/windows-$env:TARGET_ARCH"
          New-Item -ItemType Directory -Force $report | Out-Null
          & $env:CC --version | Set-Content -Encoding utf8 (Join-Path $report 'compiler-version.txt')
          & git rev-parse HEAD | Set-Content -Encoding utf8 (Join-Path $report 'source-revision.txt')
          @{ GOARCH=$env:TARGET_ARCH; CC=$env:CC; CGO_CFLAGS=$env:CGO_CFLAGS; CRT='ucrt' } |
            ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $report 'compiler-profile.json')

      - name: Probe Windows/386 cgo toolchain
        if: matrix.arch == '386'
        working-directory: src
        shell: pwsh
        env:
          GOARCH: '386'
        run: |
          & ..\scripts\go.ps1 test -x runtime/cgo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build server product
        working-directory: src
        shell: pwsh
        run: |
          & ..\scripts\go.ps1 run ./internal/noxbuild "-o=../build/windows-$env:TARGET_ARCH" -os=windows "-arch=$env:TARGET_ARCH" "-cc=$env:CC" "-cxx=$env:CXX" opennox-server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify product and run help
        working-directory: src
        shell: pwsh
        run: |
          $product = [System.IO.Path]::GetFullPath("../build/windows-$env:TARGET_ARCH/opennox-server.exe")
          & ..\scripts\go.ps1 run ./internal/noxbuild -verify $product
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $product -h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test root, server, and legacy packages
        working-directory: src
        shell: pwsh
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $report = [System.IO.Path]::GetFullPath("../build/windows-$env:TARGET_ARCH")
          & ..\scripts\go.ps1 list -tags=server . ./server ./legacy > (Join-Path $report 'expected-packages.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Keep exact JSON even for intermittent process/GC failures. These
          # are the same complete suites, with the ordinary collector.
          $env:GOTOOLCHAIN = 'local'
          $env:GOEXPERIMENT = ''
          $p = [System.Diagnostics.Process]::new()
          $p.StartInfo.FileName = (Get-Command go).Source
          $p.StartInfo.UseShellExecute = $false
          $p.StartInfo.RedirectStandardOutput = $true
          $p.StartInfo.RedirectStandardError = $true
          # Keep symbols and the actual failed/passing test executables, so
          # an intermittent memory failure remains inspectable after CI exits.
          $testOutput = Join-Path $env:RUNNER_TEMP "opennox-native-test-binaries-$env:TARGET_ARCH"
          New-Item -ItemType Directory -Force $testOutput | Out-Null
          foreach ($arg in @('test','-work',"-o=$testOutput",'-tags=server','-json','-count=1','-timeout=20m','.','./server','./legacy')) {
            $p.StartInfo.ArgumentList.Add($arg)
          }
          $out = [System.IO.File]::Open((Join-Path $report 'test.jsonl'), [System.IO.FileMode]::CreateNew)
          $err = [System.IO.File]::Open((Join-Path $report 'test.stderr.log'), [System.IO.FileMode]::CreateNew)
          try {
            if (-not $p.Start()) { throw 'Test process failed to start' }
            $copyOut = $p.StandardOutput.BaseStream.CopyToAsync($out)
            $copyErr = $p.StandardError.BaseStream.CopyToAsync($err)
            $p.WaitForExit()
            [System.Threading.Tasks.Task]::WaitAll(@($copyOut, $copyErr))
            $code = $p.ExitCode
          } finally {
            $out.Dispose()
            $err.Dispose()
            $p.Dispose()
          }
          $code | Set-Content -Encoding utf8 (Join-Path $report 'test.exit')
          python ../scripts/preserve-go-test-binaries.py $report $testOutput
          $preservationCode = $LASTEXITCODE
          python ../scripts/summarize-go-test.py $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($preservationCode -ne 0) { exit $preservationCode }
          exit $code

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: opennox-server-windows-${{ matrix.arch }}
          path: build/windows-${{ matrix.arch }}/
          if-no-files-found: warn
          retention-days: 1
