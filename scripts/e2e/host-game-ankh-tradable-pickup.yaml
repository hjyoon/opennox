steps:
  - action: slow
    dur: 5ms
  - action: click
    dt: 30
    x: 320
    y: 240
    name: skip startup movie
  - action: wait
    dt: 600
    name: wait for main menu
  - action: click
    x: 448
    y: 264
    name: open multiplayer
  - action: wait
    dt: 700
    name: wait for native server discovery
  - action: click
    x: 184
    y: 104
    name: host regular game
  - action: wait
    dt: 400
    name: wait for class selection
  - action: click
    x: 256
    y: 208
    name: select warrior
  - action: wait
    dt: 60
    name: wait for class details
  - action: click
    x: 512
    y: 656
    name: accept class
  - action: wait
    dt: 700
    name: wait for color selection
  - action: click
    x: 352
    y: 608
    name: accept color selection
  - action: wait
    dt: 400
    name: wait for host startup
  - action: click
    x: 512
    y: 487
    name: dismiss chat area help
  - action: wait
    dt: 30
    name: settle after help
  - action: click
    x: 700
    y: 380
    name: apply server options
  - action: wait
    dt: 120
    name: settle after server options
  - action: spawn-ground-item
    item: AnkhTradable
    expect-handler: AnkhTradablePickup
    x: 40
    y: 0
    name: spawn a stock tradable ankh beside the player
  - action: assert-server-inventory-count
    item: AnkhTradable
    count: 0
    name: verify the tradable ankh starts outside inventory
  - action: wait
    dt: 30
    name: receive tradable ankh drawable
  - action: pickup-ground-item
    name: pick up tradable ankh through mouse and MSG_TRY_GET
  - action: assert-ground-item-consumed-extra-life
    name: verify extra life increment and exact object consumption
  - action: assert-server-inventory-count
    item: AnkhTradable
    count: 0
    name: verify the tradable ankh was not inventoried
  - action: quit
    dt: 1
